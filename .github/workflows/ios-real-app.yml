name: Real Abla iOS Simulator integration
on:
  push:
    branches: [feat/ios-host]
    paths: [.github/workflows/ios-real-app.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-one:
    name: AOT One application on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ABLA_NATIVE_JOBS: 2
      ABLA_CODEGEN_JOBS: 2
      JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6d9cfaf574031729d2426565c47bad9c20712a47
          path: abla-mobile
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AndreBaltazar8/abla-one
          ref: 0ab017ff459d71c603c0b649cdd5739b3bae8ef6
          path: abla-one
          persist-credentials: false
      - uses: AndreBaltazar8/setup-abla@13c3fdc74b5961bf2d281b25c47e4b9ace18d11e
        with:
          version: 0.2.48
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/ios-real-evidence"
      - name: Record exact source and compiler provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            for repo in abla-mobile abla-one; do git -C "$repo" rev-parse HEAD; done
            sw_vers; xcodebuild -version; swift --version
            ablac --version
            shasum -a 256 "$(command -v ablac)"
          } | tee "$RUNNER_TEMP/ios-real-evidence/versions.txt"
      - name: Run all One contracts with released 0.2.48
        id: contracts
        continue-on-error: true
        working-directory: abla-one
        shell: bash
        run: |
          set -euo pipefail
          ablac package update --project .
          git diff --exit-code -- abla.lock
          mkdir -p build
          ablac build tools/check-native-build-roots.ab -o build/check-native-build-roots --fast
          ablac test tests/unit/*.ab tests/backends/*.ab tests/integration/*.ab \
            tests/remote/client.ab tests/remote/routes.ab \
            2>&1 | tee "$RUNNER_TEMP/ios-real-evidence/one-contracts.log"
      - name: Build actual One application archives for both iOS slices
        working-directory: abla-one
        shell: bash
        run: |
          set -euo pipefail
          ablac build tests/ios_xcframework.ab -o build/ios-driver --fast --no-cache \
            2>&1 | tee "$RUNNER_TEMP/ios-real-evidence/ios-archives.log"
          build/ios-driver
          for target in ios-arm64 ios-arm64-simulator; do
            archive="build/ios-real-app/$target/libabla_app.a"
            test -s "$archive"
            shasum -a 256 "$archive"
            nm -gU "$archive" | grep -E '_abla_mobile_run$|_abla_mobile_application_protocol_version$'
            llvm-objdump --macho --private-headers "$archive" \
              > "$RUNNER_TEMP/ios-real-evidence/$target-platform.txt"
            node ../abla-mobile/runtime/ios-host/Tests/check-archive-platform.mjs \
              "$RUNNER_TEMP/ios-real-evidence/$target-platform.txt" "$target"
          done
          ../abla-mobile/runtime/ios-host/Tests/check-xcframework.sh \
            "$PWD/build/ios-real-app/AblaApp.xcframework" "$PWD/build/ios-real-app" \
            "$RUNNER_TEMP/ios-real-evidence/packaging"
      - name: Link real Abla archive and execute unchanged SwiftUI journeys
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-real-evidence/simulators.json"
          device=$(jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))][0].udid' \
            "$RUNNER_TEMP/ios-real-evidence/simulators.json")
          test -n "$device" && test "$device" != null
          if test "$(jq -r --arg id "$device" '.devices[][] | select(.udid == $id) | .state' "$RUNNER_TEMP/ios-real-evidence/simulators.json")" = Shutdown; then
            xcrun simctl boot "$device"
          fi
          xcrun simctl bootstatus "$device" -b
          archive="$GITHUB_WORKSPACE/abla-one/build/ios-real-app/ios-arm64-simulator/libabla_app.a"
          set +e
          xcodebuild test -project abla-mobile/runtime/ios-host/SmokeApp/HostSmoke.xcodeproj \
            -scheme HostSmoke -sdk iphonesimulator -destination "id=$device" \
            -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/ios-real-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-real-evidence/RealOne.xcresult" \
            -only-testing:HostSmokeUITests/HostSmokeUITests/testApplicationReplacementPreservesExactUnicodeBytes \
            -only-testing:HostSmokeUITests/HostSmokeUITests/testMultilineModelReplacementPreservesExactUnicodeBytes \
            -only-testing:HostSmokeUITests/HostSmokeUITests/testMultilineTypingPreservesNewlineThroughChangeEvent \
            -only-testing:HostSmokeUITests/HostSmokeUITests/testNewRouteCannotRetainUnacknowledgedSecureEdit \
            -only-testing:HostSmokeUITests/HostSmokeUITests/testSecureEditingExactActionAndNativeDisabledState \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_SOURCE_FILE_NAMES=fake_app.c "OTHER_LDFLAGS=\$(inherited) $archive" \
            2>&1 | tee "$RUNNER_TEMP/ios-real-evidence/simulator-real.log"
          result=${PIPESTATUS[0]}
          set -e
          if test "$result" -ne 0; then
            xcrun simctl spawn "$device" log show --last 3m --style compact --predicate 'process == "HostSmoke"' \
              > "$RUNNER_TEMP/ios-real-evidence/app-after-failure.log" 2>&1 || true
          fi
          exit "$result"
      - name: Keep a failed One contract run authoritative
        if: always()
        shell: bash
        env:
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
        run: |
          if test "$CONTRACT_OUTCOME" != success; then
            echo 'One contracts did not pass; independent application evidence does not make the full gate green.' >&2
            exit 1
          fi
      - name: Retain actual application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-real-application-evidence
          path: ${{ runner.temp }}/ios-real-evidence
          retention-days: 14
