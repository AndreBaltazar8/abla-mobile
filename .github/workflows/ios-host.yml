name: iOS host contracts
on:
  push:
    branches: [feat/ios-host]
    paths:
      - runtime/ios-host/**
      - runtime/native/abla_mobile_ios_abi.c
      - .github/workflows/ios-host.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-and-abi:
    name: macOS model tests and iOS ABI slices
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: AndreBaltazar8/setup-abla@13c3fdc74b5961bf2d281b25c47e4b9ace18d11e
        with:
          version: 0.2.46
      - name: Record exact host/tool versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-host-evidence"
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            ablac --version
          } | tee "$RUNNER_TEMP/ios-host-evidence/versions.txt"
      - name: Test bounded tree and editor contracts on macOS
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path runtime/ios-host --scratch-path "$RUNNER_TEMP/ios-model-build" \
            2>&1 | tee "$RUNNER_TEMP/ios-host-evidence/model-tests.log"
      - name: Compile mobile-owned ABI support for both iOS platforms
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'iphoneos arm64-apple-ios17.0' 'iphonesimulator arm64-apple-ios17.0-simulator'; do
            read -r sdk target <<< "$pair"
            root=$(xcrun --sdk "$sdk" --show-sdk-path)
            object="$RUNNER_TEMP/ios-host-evidence/ios-abi-$sdk.o"
            xcrun --sdk "$sdk" clang -target "$target" -isysroot "$root" \
              -std=c11 -Wall -Wextra -Werror -c runtime/native/abla_mobile_ios_abi.c -o "$object"
            file "$object"
            xcrun vtool -show-build "$object"
            nm -gU "$object" | grep '_abla_mobile_ios_abi_version'
          done
      - name: Exercise native bridge with a fake application producer
        shell: bash
        run: |
          set -euo pipefail
          runtime/ios-host/Tests/NativeBridge/run.sh "$RUNNER_TEMP/ios-native-bridge" \
            2>&1 | tee "$RUNNER_TEMP/ios-host-evidence/native-bridge.log"
      - name: Compile SwiftUI host for device and simulator
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'iphoneos arm64-apple-ios17.0' 'iphonesimulator arm64-apple-ios17.0-simulator'; do
            read -r sdk target <<< "$pair"
            swift build --package-path runtime/ios-host --target AblaMobileHost \
              --scratch-path "$RUNNER_TEMP/ios-host-$sdk" --triple "$target" \
              --sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" \
              2>&1 | tee "$RUNNER_TEMP/ios-host-evidence/swiftui-$sdk.log"
          done
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-host-contract-evidence
          path: ${{ runner.temp }}/ios-host-evidence
          retention-days: 14
  simulator-presentation:
    name: iOS Simulator presentation with fake producer
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise actual SwiftUI secure editing and disabled action
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-ui-evidence"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-ui-evidence/simulators.json"
          device=$(jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))][0].udid' \
            "$RUNNER_TEMP/ios-ui-evidence/simulators.json")
          test -n "$device" && test "$device" != null
          set +e
          xcodebuild test -project runtime/ios-host/SmokeApp/HostSmoke.xcodeproj \
            -scheme HostSmoke -sdk iphonesimulator -destination "id=$device" \
            -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/ios-smoke-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-ui-evidence/HostSmoke.xcresult" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/ios-ui-evidence/simulator-ui.log"
          result=${PIPESTATUS[0]}
          set -e
          if test "$result" -ne 0; then
            xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-ui-evidence/devices-after-failure.json"
            xcrun simctl spawn "$device" log show --last 3m --style compact \
              --predicate 'process == "HostSmoke"' \
              > "$RUNNER_TEMP/ios-ui-evidence/app-after-failure.log" 2>&1 || true
            mkdir -p "$RUNNER_TEMP/ios-ui-evidence/crashes"
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'HostSmoke*' \
              -exec cp {} "$RUNNER_TEMP/ios-ui-evidence/crashes/" \; || true
          fi
          exit "$result"
      - name: Retain presentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-presentation-evidence
          path: ${{ runner.temp }}/ios-ui-evidence
          retention-days: 14
